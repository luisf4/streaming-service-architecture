global:
  scrape_interval: 10s

scrape_configs:
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # transcoder is intentionally left out: it's the service Fase 9 scales
  # horizontally (--scale transcoder=N), and a static target list can't
  # follow replicas that come and go. Revisit with DNS-based service
  # discovery if/when transcoder needs per-replica metrics.
  - job_name: streaming-services
    static_configs:
      - targets:
          - validator:9090
          - dispatcher:9090
          - aggregator:9090
          - upload-api:3001
