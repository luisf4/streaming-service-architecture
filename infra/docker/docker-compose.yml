x-app-env: &app-env
  DATABASE_URL: postgresql://streaming:streaming@postgres:5432/streaming
  RABBITMQ_URL: amqp://streaming:streaming@rabbitmq:5672
  S3_ENDPOINT: http://minio:9000
  # Presigned URLs go to a browser on the host, which can't resolve the
  # `minio` hostname - only upload-api/stream-api read this (StorageClient's
  # presignS3); everyone else keeps talking to MinIO directly via S3_ENDPOINT.
  S3_PUBLIC_ENDPOINT: http://localhost:8080
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: streaming
  S3_SECRET_ACCESS_KEY: streamingsecret
  S3_RAW_BUCKET: raw
  S3_HLS_BUCKET: hls
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: streaming
      POSTGRES_DB: streaming
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: streaming
      RABBITMQ_DEFAULT_PASS: streaming
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: streaming
      MINIO_ROOT_PASSWORD: streamingsecret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - minio
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  jaeger:
    image: jaegertracing/all-in-one:1.62
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: streaming
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  # One-shot: applies Prisma migrations against `postgres`, then exits.
  # Reuses upload-api's image (it already depends on @video-streaming/database)
  # rather than a dedicated Dockerfile just for this.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        APP: upload-api
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://streaming:streaming@postgres:5432/streaming
    working_dir: /app/backend/packages/database
    entrypoint: ["npx", "prisma", "migrate", "deploy"]

  # One-shot: creates the raw/hls buckets MinIO doesn't have on first boot, then exits.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 streaming streamingsecret &&
        mc mb --ignore-existing local/raw &&
        mc mb --ignore-existing local/hls

  upload-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        APP: upload-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      PORT: 3001
    ports:
      - "3001:3001"

  stream-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        APP: stream-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      PORT: 3002
    ports:
      - "3002:3002"

  validator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        APP: validator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment: *app-env

  dispatcher:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        APP: dispatcher
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment: *app-env

  transcoder:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        APP: transcoder
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment: *app-env

  aggregator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        APP: aggregator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment: *app-env

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - upload-api
      - stream-api
    environment:
      NEXT_PUBLIC_UPLOAD_API_URL: http://localhost:3001
      NEXT_PUBLIC_STREAM_API_URL: http://localhost:3002
    ports:
      - "3003:3000"

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:
