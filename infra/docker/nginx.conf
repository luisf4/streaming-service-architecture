server {
    listen 80;

    # Nginx's 1MB default rejects any real upload part (min 5 MiB, see
    # frontend's MIN_PART_SIZE) before it ever reaches MinIO.
    client_max_body_size 0;

    location / {
        proxy_pass http://minio:9000;
        # $host drops the port ("localhost", not "localhost:8080") - S3's
        # SigV4 signs the exact Host header the client used, so a presigned
        # URL signed for this proxy's own host:port only validates if that
        # port survives the hop to MinIO. $http_host preserves it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
