name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Verify generated API client is up to date
        run: |
          pnpm --filter @video-streaming/web run generate:api-types
          git diff --exit-code -- frontend/web/src/lib/generated || \
            (echo "::error::frontend/web/src/lib/generated is stale - run 'pnpm --filter @video-streaming/web run generate:api-types' and commit the result" && exit 1)

      - name: Test
        run: pnpm run test

      - name: Integration tests (Testcontainers)
        run: pnpm turbo run test:integration

      - name: Build
        run: pnpm run build
